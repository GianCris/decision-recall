<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Decision Recall architecture</title>
  <desc id="desc">Release-proven Gemini interpretation and a live browser capture path converge independently into one deterministic Decision Recall core. Historical state is preserved while current applicability is reevaluated, stopping at missing reuse evidence.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/><stop offset="0.55" stop-color="#f7f3eb"/><stop offset="1" stop-color="#f1ede4"/>
    </linearGradient>
    <radialGradient id="field"><stop offset="0" stop-color="#dce7ef" stop-opacity=".65"/><stop offset=".62" stop-color="#e9e5d9" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#13263f"/><stop offset="1" stop-color="#07121f"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#14253a" flood-opacity=".12"/></filter>
    <marker id="arrowNavy" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#17304f"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5 0 9Z" fill="#177454"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#142033} .eyebrow{font-size:13px;font-weight:700;letter-spacing:2.4px} .tiny{font-size:12px;letter-spacing:.8px} .small{font-size:14px} .body{font-size:16px} .label{font-size:15px;font-weight:700;letter-spacing:1.2px} .title{font-size:27px;font-weight:750;letter-spacing:.3px} .hero{font-size:30px;font-weight:760;letter-spacing:.2px} .muted{fill:#65707c}.navy{fill:#132b49}.green{fill:#177454}.amber{fill:#a96508}.red{fill:#ae3a32}.white{fill:#fff}.line{fill:none;stroke:#17304f;stroke-width:2}.hair{fill:none;stroke:#85909b;stroke-width:1.3}.dash{stroke-dasharray:7 7}.box{fill:#fffdf9;stroke:#d9d5cb;stroke-width:1.3}.pill{fill:#f7f4ed;stroke:#d8d3c8;stroke-width:1}.cap{font-size:13px;font-weight:650;letter-spacing:1px}.corecopy text{font-size:15px;fill:#dfe8f0}.corehead{font-size:32px;font-weight:800;fill:#fff;letter-spacing:.5px}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#paper)"/>
  <circle cx="1020" cy="465" r="520" fill="url(#field)"/>
  <g opacity=".3" fill="none" stroke="#8f9aa4"><circle cx="1020" cy="465" r="292"/><circle cx="1020" cy="465" r="360"/><circle cx="1020" cy="465" r="430" stroke-dasharray="2 12"/></g>

  <g transform="translate(64 48)">
    <circle cx="26" cy="26" r="26" fill="#0b1827"/><text x="26" y="32" text-anchor="middle" class="label white">DR</text>
    <text x="70" y="23" class="eyebrow">DECISION RECALL · ARCHITECTURE</text>
    <text x="70" y="48" class="tiny amber">TEMPORAL EPISTEMIC CONTROL</text>
  </g>
  <text x="960" y="61" text-anchor="middle" class="hero navy">Gemini interprets. Decision Recall authorizes.</text>
  <text x="960" y="91" text-anchor="middle" class="body muted">History is preserved. Applicability is reevaluated.</text>

  <!-- Zone A: release-proven compiler path -->
  <g transform="translate(58 142)">
    <rect width="450" height="655" rx="28" class="box" filter="url(#shadow)"/>
    <text x="30" y="38" class="eyebrow navy">CREDENTIALED COMPILER PATH</text><text x="30" y="62" class="tiny muted">RELEASE EVIDENCE · NOT THE LIVE HERO REQUEST</text>
    <rect x="30" y="90" width="390" height="68" rx="14" class="pill"/><text x="54" y="118" class="label">SOURCE EVIDENCE</text><text x="54" y="141" class="small muted">bounded documents + exact source spans</text>
    <path d="M225 158v25" class="line" marker-end="url(#arrowNavy)"/>
    <rect x="30" y="188" width="390" height="104" rx="16" fill="#f1f5f8" stroke="#aab7c4"/>
    <text x="54" y="219" class="eyebrow navy">PROBABILISTIC INTERPRETATION</text><text x="54" y="250" class="title navy">Gemini 3.7 Flash</text><text x="54" y="275" class="small muted">Google GenAI SDK</text>
    <path d="M225 292v25" class="line" marker-end="url(#arrowNavy)"/>
    <rect x="30" y="322" width="390" height="110" rx="16" class="pill"/><text x="54" y="351" class="label">CANDIDATE EVIDENCE</text><text x="54" y="377" class="small muted">semantic key · kind</text><text x="54" y="401" class="small muted">grounded source span</text>
    <text x="225" y="461" text-anchor="middle" class="tiny amber">GEMINI MAY PROPOSE EVIDENCE. IT CANNOT GRANT AUTHORITY.</text>
    <line x1="30" y1="484" x2="420" y2="484" stroke="#b5771b" stroke-width="3"/>
    <rect x="111" y="470" width="228" height="28" rx="14" fill="#fff7e8"/><text x="225" y="489" text-anchor="middle" class="eyebrow amber">TRUST BOUNDARY</text>
    <path d="M225 500v25" class="line" marker-end="url(#arrowNavy)"/>
    <rect x="30" y="530" width="390" height="80" rx="16" fill="#f8fbf9" stroke="#76a994" stroke-width="1.5"/><text x="54" y="561" class="label green">DETERMINISTIC ADMISSION</text><text x="54" y="586" class="small muted">grounding · identity · policy</text>
  </g>

  <!-- Release-proven semantic convergence, visually distinct from live request traffic. -->
  <path d="M478 712C548 712 548 520 620 520" fill="none" stroke="#657d94" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#arrowNavy)"/>
  <text x="280" y="780" text-anchor="middle" class="tiny muted">DASHED = RELEASE-PROVEN → SAME CORE</text>

  <!-- Cloud Run infrastructure envelope -->
  <g>
    <rect x="575" y="132" width="785" height="682" rx="34" fill="#fff" fill-opacity=".28" stroke="#9ba5ad" stroke-width="1.5" stroke-dasharray="9 8"/>
    <rect x="610" y="118" width="230" height="30" rx="15" fill="#f1eee7"/><text x="725" y="138" text-anchor="middle" class="eyebrow muted">GOOGLE CLOUD RUN</text>
    <text x="1330" y="138" text-anchor="end" class="tiny muted">DEPLOYED WINNER SLICE</text>
  </g>

  <!-- Zone B: dominant deterministic core -->
  <g filter="url(#shadow)">
    <rect x="620" y="205" width="690" height="390" rx="42" fill="url(#core)"/>
    <circle cx="965" cy="400" r="166" fill="none" stroke="#65a98e" stroke-opacity=".28"/><circle cx="965" cy="400" r="184" fill="none" stroke="#9aa9b5" stroke-opacity=".18" stroke-dasharray="4 11"/>
  </g>
  <text x="965" y="256" text-anchor="middle" class="eyebrow" fill="#79b69d">SINGLE CONVERGENCE POINT</text>
  <text x="965" y="301" text-anchor="middle" class="corehead">DECISION RECALL</text><text x="965" y="336" text-anchor="middle" class="title white">DETERMINISTIC CORE</text>
  <line x1="850" y1="360" x2="1080" y2="360" stroke="#5e7894"/>
  <g class="corecopy"><text x="710" y="402">Evidence grounding / provenance</text><text x="710" y="435">Canonical identity</text><text x="710" y="468">Authority policy</text><text x="710" y="501">Critical-gap selection</text><text x="1030" y="402">Temporal semantics</text><text x="1030" y="435">Evaluation</text><text x="1030" y="468">Strict replay</text><text x="1030" y="501">Epistemic boundary</text></g>
  <rect x="748" y="535" width="434" height="36" rx="18" fill="#183b35" stroke="#4a8871"/><text x="965" y="559" text-anchor="middle" class="cap white">ONLY ADMITTED EVIDENCE MAY BECOME AUTHORITY</text>

  <!-- Zone C client side: browser and human remain outside Cloud Run. -->
  <g transform="translate(1400 145)">
    <text x="0" y="20" class="eyebrow navy">HUMAN KNOWLEDGE BOUNDARY</text>
    <rect x="0" y="42" width="455" height="92" rx="18" fill="#fff8ea" stroke="#c88a2d"/>
    <circle cx="34" cy="88" r="18" fill="#fff" stroke="#c88a2d" stroke-width="2"/><text x="34" y="95" text-anchor="middle" class="title amber">?</text>
    <text x="66" y="76" class="label amber">CRITICAL GAP · R2</text><text x="66" y="103" class="small muted">Core issues one exact question it must not infer.</text>
    <path d="M228 134v24" class="line" marker-end="url(#arrowNavy)"/>
    <rect x="0" y="164" width="455" height="92" rx="18" class="box"/>
    <text x="24" y="195" class="label navy">BROWSER / TEMPORAL OBSERVATORY</text><text x="24" y="222" class="small muted">presents the exact issued question</text><text x="24" y="244" class="tiny muted">presentation may not establish authority</text>
    <path d="M228 256v18" class="line" marker-end="url(#arrowNavy)"/>
    <rect x="112" y="280" width="232" height="48" rx="24" fill="#fffdf9" stroke="#a0aab2"/>
    <text x="228" y="301" text-anchor="middle" class="label navy">HUMAN RESPONSE</text><text x="228" y="320" text-anchor="middle" class="tiny muted">returned through the browser</text>
    <path d="M228 328v18" class="line" marker-end="url(#arrowNavy)"/>
    <line x1="0" y1="360" x2="455" y2="360" stroke="#b5771b" stroke-width="3"/>
    <rect x="100" y="346" width="255" height="28" rx="14" fill="#fff7e8"/><text x="228" y="365" text-anchor="middle" class="eyebrow amber">SERVER BOUNDARY</text>
    <text x="228" y="398" text-anchor="middle" class="tiny muted">Browser may present. Server-bound Core may establish.</text>
  </g>

  <!-- Server-owned capture path, explicitly inside the Cloud Run envelope. -->
  <path d="M1400 505H1378V690H1310" class="line" marker-end="url(#arrowNavy)"/>
  <text x="1370" y="600" text-anchor="end" class="tiny muted">VERIFIED RESPONSE ENTERS CLOUD RUN</text>
  <rect x="1010" y="640" width="300" height="100" rx="18" fill="#f5f7f8" stroke="#7f8e9a" stroke-width="1.5"/>
  <text x="1034" y="672" class="label navy">CAPTURE GATE API</text><text x="1034" y="697" class="small muted">reconstruct preparation · verify binding</text><text x="1034" y="721" class="small green">verified → completion permitted</text>
  <path d="M1160 640V604" class="line" marker-end="url(#arrowNavy)"/>

  <!-- The deterministic core, not Capture Gate, establishes historical authority. -->
  <path d="M805 595V650" fill="none" stroke="#177454" stroke-width="2.3" marker-end="url(#arrowGreen)"/>
  <rect x="650" y="655" width="310" height="66" rx="18" fill="#ecf6f1" stroke="#4d9276"/>
  <text x="805" y="682" text-anchor="middle" class="label green">HISTORICAL ROLE ESTABLISHED</text><text x="805" y="706" text-anchor="middle" class="small muted">R2 · deterministic authority policy</text>
  <path d="M805 721V814" fill="none" stroke="#177454" stroke-width="2.3" marker-end="url(#arrowGreen)"/>
  <text x="820" y="777" class="tiny green">PRESERVED THROUGH TIME · LATER WORLD STATE</text>

  <!-- Presentation flow, explicitly non-authoritative -->
  <path d="M1310 285h68" class="hair" marker-end="url(#arrowNavy)"/><text x="1344" y="271" text-anchor="middle" class="tiny muted">PRESENTATION DTO</text><text x="1344" y="318" text-anchor="middle" class="tiny muted">projection · no authority</text>

  <!-- Zone D: temporal reevaluation and literal stop -->
  <g transform="translate(585 840)">
    <text x="0" y="0" class="eyebrow navy">TEMPORAL DECISION STATE</text><text x="0" y="25" class="tiny muted">Deterministic ledger semantics · in-memory golden slice</text>
    <path d="M325 7h55" class="line" marker-end="url(#arrowNavy)"/>
    <rect x="390" y="-38" width="250" height="88" rx="18" class="box"/><text x="415" y="-5" class="label navy">CURRENT-WORLD EVALUATION</text><text x="415" y="21" class="small red">M1 · Apex — DOES NOT MATCH</text><text x="415" y="43" class="small green">M2 · Beacon — MATCHES</text>
    <path d="M640 7h48" class="line" marker-end="url(#arrowNavy)"/>
    <rect x="698" y="-38" width="240" height="88" rx="18" class="box"/><text x="722" y="-5" class="label navy">REUSE EVALUATION</text><text x="722" y="24" class="small muted">R2 survives · sufficient alone?</text>
    <path d="M938 7h48" class="line" marker-end="url(#arrowNavy)"/>
    <circle cx="1025" cy="7" r="39" fill="#fff8ea" stroke="#c88a2d" stroke-width="2"/><text x="1025" y="18" text-anchor="middle" font-size="36" class="amber">?</text>
    <text x="1085" y="0" class="eyebrow amber">INSUFFICIENT EVIDENCE</text><text x="1085" y="24" class="small muted">No evidence → no authority</text><text x="1085" y="45" class="small muted">→ no fabricated completion.</text>
    <line x1="1061" y1="-34" x2="1061" y2="49" stroke="#a96508" stroke-width="4"/>
    <text x="1046" y="-48" text-anchor="middle" class="eyebrow amber">STOP</text>
    <!-- Intentional empty space after the unresolved requirement: no edge is drawn. -->
  </g>

  <!-- Failure policy -->
  <g transform="translate(58 950)">
    <rect width="1804" height="92" rx="22" fill="#ebe7df" stroke="#d1ccc1"/>
    <text x="28" y="31" class="eyebrow navy">FAILURE POLICY</text><text x="28" y="60" class="small navy">Uncertainty is preserved, never promoted into authority.</text>
    <line x1="390" y1="17" x2="390" y2="75" stroke="#cbc5ba"/>
    <text x="425" y="33" class="label">NO ADMISSIBLE CANDIDATE</text><text x="425" y="59" class="small muted">nothing enters authority</text>
    <line x1="815" y1="17" x2="815" y2="75" stroke="#cbc5ba"/>
    <text x="850" y="33" class="label">CAPTURE NOT VERIFIED</text><text x="850" y="59" class="small muted">unresolved remains unresolved</text>
    <line x1="1240" y1="17" x2="1240" y2="75" stroke="#cbc5ba"/>
    <text x="1275" y="33" class="label">MISSING REUSE REQUIREMENT</text><text x="1275" y="59" class="small muted">insufficient evidence; no invented completion</text>
  </g>
</svg>
