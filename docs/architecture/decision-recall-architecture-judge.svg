<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Decision Recall judge-facing architecture</title>
  <desc id="desc">A separate release-evidence Gemini lane supplies admitted candidates to one Decision Recall core. In the live Cloud Run lane, that core selects an unresolved relation, issues a question, receives a server-verified declaration, completes authority in the same core, and combines temporal state with independent later-world evidence for reevaluation.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f1"/>
      <stop offset=".55" stop-color="#f7f3ea"/>
      <stop offset="1" stop-color="#f0eade"/>
    </linearGradient>
    <radialGradient id="field" cx="57%" cy="52%" r="52%">
      <stop offset="0" stop-color="#d9e9e2" stop-opacity=".65"/>
      <stop offset=".52" stop-color="#eaf0ea" stop-opacity=".24"/>
      <stop offset="1" stop-color="#f8f4ec" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a3048"/>
      <stop offset="1" stop-color="#071321"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#172335" flood-opacity=".12"/>
    </filter>
    <marker id="arrowNavy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l9 5-9 5z" fill="#263a50"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l9 5-9 5z" fill="#14765c"/>
    </marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1l9 5-9 5z" fill="#b36a17"/>
    </marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#152338}
      .caps{font-size:16px;font-weight:750;letter-spacing:2.7px}
      .label{font-size:20px;font-weight:700}
      .small{font-size:15px;fill:#687480}
      .box{fill:#fffdf8;stroke:#d4cdbf;stroke-width:1.5}
      .release{stroke:#526b84}
      .live{stroke:#168065}
      .amber{stroke:#b56c18}
      .line{fill:none;stroke:#263a50;stroke-width:2.4}
      .greenLine{fill:none;stroke:#14765c;stroke-width:2.7}
      .amberLine{fill:none;stroke:#b36a17;stroke-width:2.5}
      .dash{stroke-dasharray:9 9}
      .inverse{fill:#fff}
      .inverseSub{fill:#bccad5}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#paper)"/>
  <circle cx="1110" cy="560" r="570" fill="url(#field)"/>
  <g opacity=".27" fill="none" stroke="#9ca8ae">
    <circle cx="1120" cy="570" r="350"/>
    <circle cx="1120" cy="570" r="465"/>
    <path d="M70 570H1850" stroke-dasharray="2 13"/>
  </g>

  <g transform="translate(72 48)">
    <circle cx="28" cy="28" r="28" fill="#101d2d"/>
    <text x="28" y="35" class="inverse" font-size="17" font-weight="800" text-anchor="middle">DR</text>
    <text x="78" y="24" font-size="23" font-weight="800" letter-spacing="5">DECISION RECALL</text>
    <text x="78" y="50" font-size="12" font-weight="700" letter-spacing="4" fill="#a85a19">TEMPORAL AUTHORITY</text>
  </g>

  <text x="1060" y="72" text-anchor="middle" font-size="39" font-weight="800">MEMORY IS NOT AUTHORITY.</text>
  <text x="1060" y="113" text-anchor="middle" font-size="23" fill="#53606b">Gemini interprets. Decision Recall authorizes.</text>

  <!-- Separate release evidence lane -->
  <g transform="translate(78 154)">
    <text class="caps" fill="#405b74">RELEASE EVIDENCE — SEPARATE VERIFIED PATH</text>
    <text y="27" class="small">credentialed · verified separately · not invoked by live demo</text>
    <line y1="48" x2="500" y2="48" stroke="#718ba2" stroke-width="2"/>
  </g>
  <g filter="url(#shadow)">
    <rect class="box release" x="105" y="230" width="360" height="94" rx="18"/>
    <text x="285" y="266" text-anchor="middle" class="caps">SOURCE RECORDS</text>
    <text x="285" y="297" text-anchor="middle" font-size="18">human-readable decision evidence</text>

    <rect class="box release" x="105" y="365" width="360" height="94" rx="18"/>
    <text x="285" y="401" text-anchor="middle" class="caps">GEMINI 3.7 FLASH</text>
    <text x="285" y="432" text-anchor="middle" font-size="18" font-weight="700">RELEASE-PROVEN INTERPRETATION</text>

    <rect class="box release" x="105" y="500" width="360" height="94" rx="18"/>
    <text x="285" y="536" text-anchor="middle" class="caps">BOUNDED CANDIDATES</text>
    <text x="285" y="567" text-anchor="middle" font-size="18">fact + historical-role proposal</text>

    <rect class="box release" x="105" y="635" width="360" height="105" rx="18"/>
    <text x="285" y="672" text-anchor="middle" class="caps">DETERMINISTIC ADMISSION</text>
    <text x="285" y="703" text-anchor="middle" font-size="18">exact grounding + profile</text>
    <text x="285" y="727" text-anchor="middle" class="small">candidate ≠ authority</text>
  </g>
  <path class="line dash" d="M285 324V355" marker-end="url(#arrowNavy)"/>
  <path class="line dash" d="M285 459V490" marker-end="url(#arrowNavy)"/>
  <path class="line dash" d="M285 594V625" marker-end="url(#arrowNavy)"/>

  <!-- Live Cloud Run lane, dominated by one core -->
  <g transform="translate(650 154)">
    <text class="caps" fill="#116e56">LIVE CLOUD RUN · D-104 AUTHORITY PATH</text>
    <text y="27" class="small">the live YES path does not invoke Gemini</text>
    <line y1="48" x2="1165" y2="48" stroke="#4ca188" stroke-width="2"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="720" y="230" width="580" height="124" rx="62" fill="url(#core)" stroke="#4d6b83" stroke-width="2"/>
    <text x="1010" y="272" text-anchor="middle" class="inverse" font-size="17" font-weight="700" letter-spacing="3">ONE DECISION RECALL CORE</text>
    <text x="1010" y="310" text-anchor="middle" class="inverse" font-size="29" font-weight="800">GROUNDING · IDENTITY · POLICY</text>
    <text x="1010" y="337" text-anchor="middle" class="inverseSub" font-size="17">gap selection · capture preparation · authority</text>

    <rect class="box amber" x="790" y="405" width="440" height="80" rx="18"/>
    <text x="1010" y="437" text-anchor="middle" class="caps">UNRESOLVED HUMAN-ONLY RELATION</text>
    <text x="1010" y="467" text-anchor="middle" font-size="18" fill="#a45e12">selected by Decision Recall</text>

    <rect class="box live" x="790" y="535" width="440" height="88" rx="18"/>
    <text x="1010" y="569" text-anchor="middle" class="caps">EXACT CLARIFICATION</text>
    <text x="1010" y="598" text-anchor="middle" font-size="18">Did Beacon's delay materially influence D-104?</text>

    <rect class="box live" x="790" y="673" width="440" height="82" rx="18"/>
    <text x="1010" y="706" text-anchor="middle" class="caps">HUMAN DECLARATION</text>
    <text x="1010" y="736" text-anchor="middle" font-size="18">returned through the browser</text>

    <rect class="box live" x="790" y="805" width="440" height="94" rx="18"/>
    <text x="1010" y="840" text-anchor="middle" class="caps">CAPTURE GATE · SERVER VERIFIED</text>
    <text x="1010" y="870" text-anchor="middle" font-size="17">verifies session · gap · question binding</text>
    <text x="1010" y="891" text-anchor="middle" class="small">verification permits deterministic completion</text>

    <rect class="box live" x="1425" y="270" width="365" height="92" rx="18"/>
    <text x="1607" y="305" text-anchor="middle" class="caps">HISTORICAL AUTHORITY</text>
    <text x="1607" y="336" text-anchor="middle" font-size="19" fill="#13755a">may be established by the core</text>

    <rect class="box live" x="1425" y="405" width="365" height="92" rx="18"/>
    <text x="1607" y="440" text-anchor="middle" class="caps">TEMPORAL / HISTORICAL STATE</text>
    <text x="1607" y="471" text-anchor="middle" font-size="18">history remains recorded</text>
  </g>

  <!-- Release evidence enters the same product core without implying a live network call -->
  <path class="line dash" d="M465 687H610q35 0 35-35V292H710" marker-end="url(#arrowNavy)"/>
  <text x="550" y="666" text-anchor="middle" class="small">admitted release evidence</text>

  <!-- Core prepares the gap and exact question -->
  <path class="amberLine" d="M1010 354V395" marker-end="url(#arrowAmber)"/>
  <path class="amberLine" d="M1010 485V525" marker-end="url(#arrowAmber)"/>
  <path class="greenLine" d="M1010 623V663" marker-end="url(#arrowGreen)"/>
  <path class="greenLine" d="M1010 755V795" marker-end="url(#arrowGreen)"/>

  <!-- Capture verification returns to the same core; only the core emits authority -->
  <path class="greenLine" d="M1230 852H1345q35 0 35-35V292q0-30-30-30H1310" marker-end="url(#arrowGreen)"/>
  <rect x="1250" y="520" width="254" height="56" rx="28" fill="#f7f3ea" stroke="#90b8aa"/>
  <text x="1377" y="542" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.4">BACK TO THE SAME CORE</text>
  <text x="1377" y="563" text-anchor="middle" font-size="13" fill="#61746d">verified binding → completion</text>
  <path class="greenLine" d="M1300 316H1415" marker-end="url(#arrowGreen)"/>
  <text x="1357" y="299" text-anchor="middle" font-size="13" fill="#13755a">after verified completion</text>
  <path class="greenLine" d="M1607 362V395" marker-end="url(#arrowGreen)"/>

  <!-- Independent state and later-world input converge on reevaluation -->
  <g filter="url(#shadow)">
    <rect class="box" x="1230" y="610" width="280" height="82" rx="18"/>
    <text x="1370" y="643" text-anchor="middle" class="caps">LATER-WORLD EVIDENCE</text>
    <text x="1370" y="672" text-anchor="middle" class="small">independent current input</text>

    <rect class="box" x="1550" y="705" width="265" height="82" rx="18" stroke="#526b84"/>
    <text x="1682" y="738" text-anchor="middle" class="caps">REEVALUATION</text>
    <text x="1682" y="767" text-anchor="middle" font-size="18">current applicability</text>

    <rect class="box amber" x="1475" y="845" width="380" height="108" rx="18"/>
    <text x="1665" y="879" text-anchor="middle" class="caps">REUSE EVALUATION</text>
    <text x="1665" y="909" text-anchor="middle" font-size="16" fill="#13755a">sufficient authorized support: may proceed</text>
    <text x="1665" y="936" text-anchor="middle" font-size="16" fill="#a45e12">missing required support: STOP</text>
  </g>
  <path class="line" d="M1607 497V680q0 25 25 25h40" marker-end="url(#arrowNavy)"/>
  <path class="line" d="M1510 651h30v54" marker-end="url(#arrowNavy)"/>
  <path class="line" d="M1682 787V835" marker-end="url(#arrowNavy)"/>

  <g transform="translate(82 1000)">
    <circle cx="8" cy="8" r="8" fill="#526b84"/>
    <text x="28" y="14" class="small">separately verified release interpretation</text>
    <circle cx="354" cy="8" r="8" fill="#168065"/>
    <text x="374" y="14" class="small">live server-bound authority path</text>
  </g>
  <text x="1818" y="1019" text-anchor="end" font-size="21" font-weight="800" fill="#9b5d16">MISSING AUTHORITY STAYS MISSING.</text>
</svg>
