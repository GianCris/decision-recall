name: Decision Recall Core

on:
  push:
    branches:
      - agent/decision-recall-core-v0.1
  pull_request:
    paths:
      - 'decision_recall/**'
      - 'dr_bench/**'
      - 'dr_baselines/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/decision-recall-core.yml'

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Decision Recall core tests
        run: python -m unittest discover -s tests -p 'test_decision_recall_milestone1.py' -v

  repository-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository package
        run: python -m pip install -e .

      - name: Run repository test suite
        run: python -m unittest discover -s tests -v
