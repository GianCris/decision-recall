name: Decision Recall Core

on:
  push:
    branches:
      - agent/decision-recall-core-v0.1
  pull_request:
    paths:
      - 'decision_recall/**'
      - 'dr_bench/**'
      - 'dr_baselines/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/decision-recall-core.yml'

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Decision Recall core tests
        run: python -m unittest discover -s tests -p 'test_decision_recall_milestone1.py' -v

  repository-offline-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install repository package
        run: python -m pip install -e .

      - name: Run deterministic/offline repository tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          # These historical-analysis suites intentionally depend on archived local
          # experiment-output directories that are not committed to Git. They are
          # not product regressions and cannot be reproduced on a clean CI runner.
          artifact_dependent = {
              'test_dev_autopsy.py',
              'test_pauto_provider_probe.py',
              'test_round_b_recovered_analysis.py',
          }

          files = [
              str(path)
              for path in sorted(Path('tests').glob('test_*.py'))
              if path.name not in artifact_dependent
          ]
          print('Offline regression files:', len(files))
          result = subprocess.run(
              [sys.executable, '-m', 'unittest', '-v', *files],
              check=False,
          )
          raise SystemExit(result.returncode)
          PY
