steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.cloudrun
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/decision-recall/winner-slice:latest
      - .
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/decision-recall/winner-slice:latest
options:
  logging: CLOUD_LOGGING_ONLY
