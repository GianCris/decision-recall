[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dr-bench"
version = "0.1.0"
description = "A mechanism-agnostic benchmark for decision recovery"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dr-bench = "dr_bench.cli:main"

[tool.setuptools.packages.find]
include = ["dr_bench*"]

[tool.setuptools.package-data]
dr_bench = ["data/*.json", "data/*.jsonl", "schema/*.json"]
